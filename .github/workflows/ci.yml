{
  "name": "GateForge quality",
  "on": {
    "push": {
      "branches": [
        "**"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {},
    "workflow_call": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "GATEFORGE_TEST_IMAGE": "gateforge:ci",
    "PYTEST_DISABLE_PLUGIN_AUTOLOAD": "1"
  },
  "jobs": {
    "static": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "run": "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0"
        },
        {
          "run": "python scripts/ci.py static"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "static",
            "path": "artifacts/static",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "unit": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "run": "python scripts/ci.py unit"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "unit",
            "path": "artifacts/unit",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "integration": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "run": "python scripts/ci.py integration"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "integration",
            "path": "artifacts/integration",
            "if-no-files-found": "error"
          }
        }
      ],
      "services": {
        "postgres": {
          "image": "postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15",
          "env": {
            "POSTGRES_USER": "gateforge",
            "POSTGRES_PASSWORD": "test-password",
            "POSTGRES_DB": "gateforge"
          },
          "ports": [
            "5432:5432"
          ],
          "options": "--health-cmd \"pg_isready -h 127.0.0.1 -U gateforge -d gateforge\" --health-interval 3s --health-timeout 3s --health-retries 30"
        }
      },
      "env": {
        "GATEFORGE_TEST_DATABASE": "postgres://gateforge:test-password@127.0.0.1:5432/gateforge?sslmode=disable"
      }
    },
    "fuzz": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "run": "python scripts/ci.py fuzz"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "fuzz",
            "path": "artifacts/fuzz",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "run": "python scripts/ci.py build"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "build",
            "path": "artifacts/build",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "security": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "build",
            "path": "artifacts/build"
          }
        },
        {
          "run": "go install golang.org/x/vuln/cmd/govulncheck@v1.1.4\ngo install github.com/securego/gosec/v2/cmd/gosec@v2.29.0"
        },
        {
          "uses": "github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6",
          "with": {
            "languages": "go",
            "queries": "security-extended",
            "build-mode": "manual"
          }
        },
        {
          "run": "go build ./..."
        },
        {
          "uses": "github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6",
          "with": {
            "upload": false,
            "output": "artifacts/security/codeql"
          }
        },
        {
          "run": "python scripts/ci.py security"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "security",
            "path": "artifacts/security",
            "if-no-files-found": "error"
          }
        }
      ],
      "needs": [
        "build"
      ],
      "env": {
        "CODEQL_REQUIRED": "1"
      }
    },
    "e2e": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "build",
            "path": "artifacts/build"
          }
        },
        {
          "run": "python scripts/ci.py e2e"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "e2e",
            "path": "artifacts/e2e",
            "if-no-files-found": "error"
          }
        }
      ],
      "needs": [
        "build"
      ]
    },
    "quality-gate": {
      "runs-on": "ubuntu-24.04",
      "if": "${{ always() }}",
      "needs": [
        "static",
        "unit",
        "integration",
        "fuzz",
        "build",
        "security",
        "e2e"
      ],
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "./.github/actions/setup-quality"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "path": "artifacts"
          }
        },
        {
          "env": {
            "NEEDS_JSON": "${{ toJSON(needs) }}"
          },
          "run": "python -c 'import os,pathlib; pathlib.Path(\"artifacts/needs.json\").write_text(os.environ[\"NEEDS_JSON\"])'"
        },
        {
          "run": "python scripts/quality_gate.py --needs artifacts/needs.json --commit \"$GITHUB_SHA\" --run-id \"$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "quality-report",
            "path": "artifacts/quality-report.*"
          }
        }
      ]
    }
  }
}
